<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - USB</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .spinner {
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h3 class="text-center mb-4">🔐 Iniciar Sesión</h3>
    
    <!-- Mensajes de alerta -->
    <div class="alert alert-danger d-none" id="msgError"></div>
    <div class="alert alert-success d-none" id="msgExito"></div>
    
    <!-- Formulario de login -->
    <form id="formLogin">
        <div class="mb-3">
            <label class="form-label">Usuario:</label>
            <input type="text" class="form-control" id="usuario" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Contraseña:</label>
            <input type="password" class="form-control" id="contrasena" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100" id="btnLogin">
            <span class="spinner spinner-border spinner-border-sm"></span>
            <span class="btn-text">Ingresar</span>
        </button>
    </form>
    
    <hr>
    <small class="text-muted">Universidad Salesiana de Bolivia</small>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function(){
    
    // Cuando se envía el formulario
    $('#formLogin').submit(function(e){
        e.preventDefault(); // No recargar página
        
        // Mostrar cargando
        $('.spinner').show();
        $('.btn-text').text('Validando...');
        $('#btnLogin').prop('disabled', true);
        
        // Ocultar mensajes anteriores
        $('#msgError').addClass('d-none');
        $('#msgExito').addClass('d-none');
        
        // Obtener datos
        var datos = {
            username: $('#usuario').val(),
            password: $('#contrasena').val()
        };
        
        // Enviar AJAX a validar.php
        $.ajax({
            url: 'validar.php',
            type: 'POST',
            data: datos,
            dataType: 'json',
            success: function(respuesta){
                // Ocultar cargando
                $('.spinner').hide();
                $('.btn-text').text('Ingresar');
                $('#btnLogin').prop('disabled', false);
                
                if(respuesta.status == 'success'){
                    // Login correcto
                    $('#msgExito').text(respuesta.message).removeClass('d-none');
                    
                    // Redirigir a panel.php después de 2 segundos
                    setTimeout(function(){
                        window.location.href = 'panel.php';
                    }, 2000);
                    
                } else {
                    // Login incorrecto
                    $('#msgError').text(respuesta.message).removeClass('d-none');
                }
            },
            error: function(){
                // Error de conexión
                $('.spinner').hide();
                $('.btn-text').text('Ingresar');
                $('#btnLogin').prop('disabled', false);
                $('#msgError').text('Error de conexión con el servidor').removeClass('d-none');
            }
        });
    });
});
</script>

</body>
</html>
